<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Александр | Портфолио</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 40px 30px;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #e2e8f0;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--primary-color);
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { margin: 0; font-size: 24px; color: #0f172a; }
        .title { color: var(--primary-color); font-weight: 600; margin: 8px 0 16px; }
        .bio { font-size: 15px; line-height: 1.6; color: #64748b; margin-bottom: 24px; }
        .skills { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 24px; }
        .skill-tag { background: #eff6ff; color: var(--primary-color); padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: block;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #f1f5f9; color: var(--text-color); }
        .btn-secondary:hover { background: #e2e8f0; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Вместо эмодзи можно вставить <img> с вашей фотографией -->
        <div class="avatar">👨‍💻</div>
        
        <h1>Александр</h1>
        <p class="title">Начинающий Beckend-разработчик и Data-Аналитик</p>
        
        <p class="bio">
            Изучаю веб-разработку, создаю свои первые проекты и активно осваиваю Git. 
            Стремлюсь писать чистый код и создавать удобные интерфейсы.
        </p>
        
        <div class="skills">
            <span class="skill-tag">HTML5</span>
            <span class="skill-tag">CSS3</span>
            <span class="skill-tag">Git</span>
            <span class="skill-tag">GitHub</span>
        </div>
        
        <div class="links">
            <a href="https://github.com/yalexeryal" class="btn btn-primary" target="_blank">Мой GitHub</a>
            <a href="mailto:your.email@example.com" class="btn btn-secondary">Написать на Email</a>
        </div>
    </div>
</body>
</html>
